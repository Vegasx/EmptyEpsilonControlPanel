[package]
name = "epsilon-engineering-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
build = "build.rs"

[dependencies]
anyhow = "=1.0.100"
serde = "=1.0.228"
serde_json = "=1.0.145"
windows-numerics = "=0.3.1"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Networking_WinHttp",
  "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Performance",
  "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation",
  "Win32_System_Variant", "Win32_System_Com_StructuredStorage", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Pointer", "Win32_UI_HiDpi", "Win32_UI_Controls", "Foundation_Numerics"
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

